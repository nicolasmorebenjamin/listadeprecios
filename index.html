:root{--bg:#fff;--c:#fff;--t:#222;--m:#777;--a:#d32622;--r:#d32622;--b:#f1f1f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1713;--t:#f3ebe1;--m:#b3a38f;--b:#2e2620}}
:root[data-theme=dark]{--bg:#1c1713;--t:#f3ebe1;--m:#b3a38f;--b:#2e2620}
body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif;padding-bottom:64px}
.top{background:var(--r);color:#fff;padding:16px}

.w{max-width:1000px;margin:0 auto;padding:12px 14px}
.bar{display:flex;gap:8px;margin-bottom:8px}
input[type=search]{flex:1;min-width:0;padding:10px 12px;border:1px solid #ddd;border-radius:10px;background:var(--bg);color:var(--t);font-size:16px}

.cats-wrap{position:relative;margin-bottom:8px}
select#catsSelect{
  width:100%;

  border:1px solid var(--b);

  color:var(--t);
  font-size:15px;
  font-weight:600;
  appearance:none;
  -webkit-appearance:none;

  background-repeat:no-repeat;
  background-position:right 14px center;
  cursor:pointer;
  outline:none;
}

h2{margin:18px 0 12px;font-size:19px;background:var(--r);color:#fff;padding:10px 14px;border-radius:10px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:6px 8px}
.card{position:relative;text-align:center}
.ph{aspect-ratio:1;background:#ffffff;display:flex;align-items:center;justify-content:center;font-size:40px;border-radius:10px;overflow:hidden;padding:6px;box-sizing:border-box}
.ph img{width:100%;height:100%;object-fit:contain;background:#ffffff;border-radius:6px;mix-blend-mode:normal !important}
.n{padding:6px 2px 0;font-size:12.5px;font-weight:700;line-height:1.25;min-height:32px}
.p{margin:6px auto 14px;width:fit-content;background:var(--r);color:#fff;border-radius:20px;padding:5px 14px;font-weight:700;font-size:15px}

.loading{text-align:center;padding:40px 10px;font-weight:bold;color:var(--m);font-size:16px}
.sync-status{text-align:center;color:var(--m);font-size:12px;padding:4px 0 10px}

footer{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border-top:1px solid var(--b);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));font-size:13px;z-index:100}
footer button{background:none;color:var(--r);border:1px solid var(--r);padding:6px 12px;font-size:13px;border-radius:10px;cursor:pointer}

.wa-link{

  font-weight:bold;

const $ = id => document.getElementById(id);
const fm = p => (p == null || isNaN(p) || p === '') ? 'Consultar' : '$' + Number(p).toLocaleString('es-AR');

function R() {
  const q = $('q').value.toLowerCase();$('catsSelect').innerHTML = '<option value="" disabled selected>Ir a una categoría...</option>' + 
    S.map((s, i) => `<option value="${i}">${s.e} ${s.t}</option>`).join('');

  $('l').innerHTML = S.map((s, si) => {
    const it = s.a.map((x, i) => x.n.toLowerCase().includes(q) ? 
      `<div class="card"><div class="ph">${x.img ? `<img src="${x.img}" onerror="this.outerHTML='${s.e}'">` : s.e}</div><div class="n">${x.n}</div><div class="p">${fm(x.p)}</div></div>` : ''
    ).join('');
    
    return it ? `<h2 id="c${si}">${s.t}</h2><div class="g">${it}</div>` : '';
  }).join('');
}

const norm = str => str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim();

function procesarHTMLDocs(htmlText) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(htmlText, 'text/html');
  const preciosDocs = {};

  const filas = doc.querySelectorAll('tr');
  filas.forEach(f => {
    const celdas = Array.from(f.querySelectorAll('td, th')).map(c => c.textContent.trim());
    for (let i = 0; i < celdas.length - 1; i++) {
      const prodTxt = celdas[i];
      const precTxt = celdas[i + 1];
      if (prodTxt && precTxt.includes('$')) {
        const num = parseInt(precTxt.replace(/\D/g, ''));
        if (!isNaN(num)) {
          preciosDocs[norm(prodTxt)] = num;
        }
      }
    }
  });

  if (Object.keys(preciosDocs).length === 0) {
    const elementos = doc.querySelectorAll('p, span');
    let ultimoTexto = '';
    elementos.forEach(el => {
      const txt = el.textContent.trim();
      if (txt.includes('$')) {
        const num = parseInt(txt.replace(/\D/g, ''));
        if (!isNaN(num) && ultimoTexto) {
          preciosDocs[norm(ultimoTexto)] = num;
        }
      } else if (txt.length > 2 && !txt.startsWith('http')) {
        ultimoTexto = txt;
      }
    });
  }

  S.forEach(cat => {
    cat.a.forEach(prod => {
      const pBuscado = norm(prod.n);
      if (preciosDocs[pBuscado] !== undefined) {
        prod.p = preciosDocs[pBuscado];
      }
    });
  });

  R();
}

$('catsSelect').onchange = e => {
  const el = $('c' + e.target.value);
  if (el) el.scrollIntoView({ behavior: 'smooth' });
};

$('q').oninput = R;
$('up').onclick = () => scrollTo({ top: 0, behavior: 'smooth' });

async function actualizarPrecios() {
  const status = $('syncStatus');
  const urlDocsSinCache = URL_DOCS_PUB + '&_cb=' + Date.now();
  const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(urlDocsSinCache) + '&_cb=' + Date.now();

  try {
    const respuesta = await fetch(proxyUrl, { cache: 'no-store' });
    if (!respuesta.ok) throw new Error('No se pudo consultar el documento publicado');
    const html = await respuesta.text();
    if (!html || !html.includes('<html')) throw new Error('El documento publicado no devolvió contenido válido');
    procesarHTMLDocs(html);
    status.textContent = 'Precios sincronizados · ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  } catch (error) {
    // Conserva los precios visibles si la fuente falla temporalmente.
    R();
    status.textContent = 'No se pudieron actualizar los precios. Se volverá a intentar automáticamente.';
  }
}

actualizarPrecios();
// Si la página queda abierta, consulta nuevamente el documento cada minuto.
setInterval(() => {
  if (document.visibilityState === 'visible') actualizarPrecios();
}, 60 * 1000);
