let S = BASE_PRODUCTOS.map(([e,t,a])=>({e,t,a:a.map(x=>({...x, img: x.img||null}))}));
const $ = id => document.getElementById(id);
const fm = p => (p == null || isNaN(p) || p === '') ? 'Consultar' : '$' + Number(p).toLocaleString('es-AR');

function R() {
  const q = $('q').value.toLowerCase();$('catsSelect').innerHTML = '<option value="" disabled selected>Ir a una categoría...</option>' + 
    S.map((s, i) => `<option value="${i}">${s.e} ${s.t}</option>`).join('');

  $('l').innerHTML = S.map((s, si) => {
    const it = s.a.map((x, i) => x.n.toLowerCase().includes(q) ? 
      `<div class="card"><div class="ph">${x.img ? `<img src="${x.img}" onerror="this.outerHTML='${s.e}'">` : s.e}</div><div class="n">${x.n}</div><div class="p">${fm(x.p)}</div></div>` : ''
    ).join('');
    
    return it ? `<h2 id="c${si}">${s.t}</h2><div class="g">${it}</div>` : '';
  }).join('');
}

// Función para normalizar texto (sacar tildes, espacios extra, etc.)
const norm = str => str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

function procesarTextoPlano(texto) {
  const lineas = texto.split('\n');
  const preciosDocs = {};

  lineas.forEach(linea => {
    // Buscar patrones donde esté el nombre del producto y el precio con "$"
    if (linea.includes('$')) {
      const partes = linea.split('$');
      if (partes.length >= 2) {
        const prod = norm(partes[0].replace(/[\t|\t]+/g, ' '));
        const prec = parseInt(partes[1].replace(/\D/g, ''));
        if (prod && !isNaN(prec)) {
          preciosDocs[prod] = prec;
        }
      }
    }
  });

  let huboCambios = false;
  S.forEach(cat => {
    cat.a.forEach(prod => {
      const pBuscado = norm(prod.n);
      
      // Búsqueda flexible (coincidencia exacta o parcial)
      Object.keys(preciosDocs).forEach(key => {
        if (key.includes(pBuscado) || pBuscado.includes(key)) {
          if (prod.p !== preciosDocs[key]) {
            prod.p = preciosDocs[key];
            huboCambios = true;
          }
        }
      });
    });
  });

  if (huboCambios) R();
}

$('catsSelect').onchange = e => {
  const el = $('c' + e.target.value);
  if (el) el.scrollIntoView({ behavior: 'smooth' });
};

$('q').oninput = R;
$('up').onclick = () => scrollTo({ top: 0, behavior: 'smooth' });

// Render inicial inmediato
R();

// Consulta directa al documento exportado como TXT (Texto Plano sin HTML)
const txtUrl = `https://docs.google.com/document/d/${DOC_ID}/export?format=txt`;
const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(txtUrl) + '&nocache=' + Date.now();

fetch(proxyUrl)
  .then(r => r.text())
  .then(txt => procesarTextoPlano(txt))
  .catch(() => {
    fetch('https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(txtUrl))
      .then(r => r.text())
      .then(txt => procesarTextoPlano(txt))
      .catch(() => {});
