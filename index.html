<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista de precios</title>
<style>
:root{--bg:#fff;--c:#fff;--t:#222;--m:#777;--a:#d32622;--r:#d32622;--b:#f1f1f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1713;--t:#f3ebe1;--m:#b3a38f;--b:#2e2620}}
:root[data-theme=dark]{--bg:#1c1713;--t:#f3ebe1;--m:#b3a38f;--b:#2e2620}
body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif;padding-bottom:64px}
.top{background:var(--r);color:#fff;padding:16px}
h1{margin:0;font-size:24px}
.w{max-width:1000px;margin:0 auto;padding:12px 14px}
.bar{display:flex;gap:8px;margin-bottom:8px}
input[type=search]{flex:1;min-width:0;padding:10px 12px;border:1px solid #ddd;border-radius:10px;background:var(--bg);color:var(--t);font-size:16px}
button{padding:10px 14px;border:0;border-radius:10px;background:var(--r);color:#fff;font-size:15px;cursor:pointer}
button.on{background:#2e7d32}
.cats{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.chip{white-space:nowrap;background:var(--b);color:var(--t);padding:7px 12px;border-radius:16px;font-size:13px}
h2{margin:18px 0 12px;font-size:19px;background:var(--r);color:#fff;padding:10px 14px;border-radius:10px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:6px 8px}
.card{position:relative;text-align:center}
.ph{aspect-ratio:1;background:var(--b);display:flex;align-items:center;justify-content:center;font-size:40px;border-radius:8px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain;background:#fff}
.n{padding:6px 2px 0;font-size:12.5px;font-weight:700;line-height:1.25;min-height:32px}
.p{margin:6px auto 14px;width:fit-content;background:var(--r);color:#fff;border-radius:20px;padding:5px 14px;font-weight:700;font-size:15px}
.ed .ph{cursor:pointer;outline:2px dashed var(--m);outline-offset:-4px}
[contenteditable]{outline:1px dashed var(--m);border-radius:6px}
.x{position:absolute;top:4px;right:4px;padding:4px 9px;border-radius:50%;background:#000a}
.add{margin-top:10px;background:var(--m)}
.hint{color:var(--m);font-size:13px;margin:0 0 6px}
footer{position:fixed;left:0;right:0;bottom:0;display:flex;justify-between;align-items:center;gap:8px;background:var(--bg);border-top:1px solid var(--b);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));font-size:13px}
footer button{background:none;color:var(--r);border:1px solid var(--r);padding:6px 12px;font-size:13px}
</style>
</head>
<body>
<div class="top"><h1 id="h"></h1></div>
<div class="w">
<div class="bar"><input type="search" id="q" placeholder="Buscar producto..."><button id="e" hidden>Editar</button></div>
<div id="cats" class="cats"></div><p class="hint" id="hi"></p><div id="l"></div>
</div>
<footer><button id="up">Categorías ↑</button><span id="wa"></span></footer>
<input type="file" id="f" accept="image/*" hidden>

<script>
const D=[

["🧀","Quesos blandos",["Q. cremoso Barraza|9100","Q. cremoso Punta del agua|9100","Q. cremoso La Paulina|9000","Q. cremoso Lactear|8500","Q. cremoso El faisan|8300","Q. cremoso La Finca|8300","Q. cremoso los troncos|9000","Q. por salut Punta del Agua|9900","Q. por salut Cayelac|11000","Q. por salut Barraza|11000","Q. por salut s/sal Cayelac|11500","Q. por salut s/sal Barraza|11000","Q. por salut light Barraza|","Muzzarella barraza cilindro|12000","Muzzarella Lucrecia|9500","Muzza El Gauchito plancha|9800","Muzza El Gauchito|10000"]],
["🧀","Quesos en barra",["Barra punta del agua|11500","Barra Los troncos|11000","Barra Barraza|11000","Barra Sancor|14000","Barra Lucrecia|9800","Barra Biolac|9800","Barra La Paulina|12500","Fiambrin Spalem|","Fiambrin La Quesera|16000","Fiambrin la serenisima|15000","Cheddar serenisima|15000","Cheddar Cayelac|14000","Pategras Sancor|15900","Pategras La Paulina|18500","Fontina Paulina|19500"]],
["🧀","Quesos postre",["Holanda Cayelac|15900","Pategras Paulina|18900","Mar del plata doble A|14900","Mar del plata Maria Luisa|14000","Mar del plata Lactear|20000","Fontina la paulina|19500","Fontina Cayelac|18500","Queso azul Bavaria|23000","Queso azul Quesera|14500","Queso azul Lucrecia|12900","Queso azul Emperador|13900","Provoleta Doble A|14900","Provoleta Santa Rosa|35900","Provoleta Cayelac|17000"]],
["🧀","Quesos duros",["Sardo fresco Santa Lucía|10500","Sardo semi Santa Lucía|12000","Sardo duro Santa Lucía|17500","Sardo Lucrecia|16500","Sardo Santa Rosa|34500","Provolin Santa lucía|17500","Provolone Cayelac|16500","Romanito Santa Lucía|14500","Reggianito Santa Lucía|17500","Reggianito Melincué|18000","Provolone Santa Rosa|38500","Reggianito Trelau|17500","Parmesano Melincué|18500","Talita Los Troncos|"]],
["🧈","Varios lácteos y panificación",["Ricota La niña|4500","Ricota Trelau|5000","Manteca x 100 tonadita|1600","Manteca x 200 tonadita|3000","Manteca x 100 Ramolac|","Manteca x 200 Ramolac|","Grasa vacuna Esani x 500 gr|2650","Grasa porcina Esani x 500 gr|2750","Fainalind display|14000","Queso rallado suelto x kg|21000","Levadura levex 10 x 50 gr|6000","Levadura levex seca|17900","Levadura Calsa x 20x50gr|13000","Tapa rotisera Sabroricas|2750"]]
];

let S,ed=0,T='LISTA DE PRECIOS',W='WhatsApp: +54 9 11 ----',tg;
const $=id=>document.getElementById(id);
try{S=JSON.parse(localStorage.getItem('lp1'));T=localStorage.getItem('lpt')||T;W=localStorage.getItem('lpw')||W}catch(e){}
if(!S)S=D.map(([e,t,a])=>({e,t,a:a.map(s=>{const[n,p]=s.split('|');return{n,p:p?+p:null}})}));
const sv=()=>{try{localStorage.setItem('lp1',JSON.stringify(S));localStorage.setItem('lpt',T)}catch(e){alert('No hay más espacio para fotos en este dispositivo.')}};
const fm=p=>p==null?'Consultar':'$'+p.toLocaleString('es-AR');
function R(){const q=$('q').value.toLowerCase(),c=ed?' contenteditable="true"':'';
$('cats').innerHTML=S.map((s,i)=>`<button class="chip" data-c="${i}">${s.t}</button>`).join('');$('wa').textContent=W;$('wa').contentEditable=ed?'true':'false';$('h').innerHTML='<span id="t"'+c+'>'+T+'</span>';$('e').textContent=ed?'Listo':'Editar';$('e').className=ed?'on':'';$('hi').textContent=ed?'Modo edición: tocá un nombre o precio para cambiarlo, la foto para subir una, y ✕ para borrar. Se guarda solo.':'';
$('l').className=ed?'ed':'';$('l').innerHTML=S.map((s,si)=>{const it=s.a.map((x,i)=>x.n.toLowerCase().includes(q)?`<div class="card" data-s="${si}" data-i="${i}"><div class="ph">${x.img?`<img src="${x.img}">`:s.e}</div><div class="n" data-f="n"${c}>${x.n}</div><div class="p" data-f="p"${c}>${fm(x.p)}</div>${ed?'<button class="x">✕</button>':''}</div>`:'').join('');
return it||(ed&&!q)?`<h2 id="c${si}">${s.t}</h2><div class="g">${it}</div>${ed?`<button class="add" data-s="${si}">+ Agregar producto</button>`:''}`:''}).join('')}
$('q').oninput=R;$('e').onclick=()=>{ed=!ed;R()};
document.addEventListener('click',e=>{const k=e.target.closest('.card'),a=e.target.closest('.add');
const ch=e.target.closest('.chip');if(ch){$('c'+ch.dataset.c)&&$('c'+ch.dataset.c).scrollIntoView({behavior:'smooth'});return}if(e.target.id=='up'){scrollTo({top:0,behavior:'smooth'});return}
if(a){S[a.dataset.s].a.push({n:'Nuevo producto',p:null});sv();R();return}
if(!ed||!k)return;tg=[k.dataset.s,k.dataset.i];
if(e.target.className=='x'){S[tg[0]].a.splice(tg[1],1);sv();R()}else if(e.target.closest('.ph'))$('f').click()});
document.addEventListener('focusin',e=>{const d=e.target;if(d.dataset.f=='p'){const k=d.closest('.card'),p=S[k.dataset.s].a[k.dataset.i].p;d.textContent=p==null?'':p}});
document.addEventListener('focusout',e=>{const d=e.target;if(d.id=='wa'){W=d.textContent.trim()||W;try{localStorage.setItem('lpw',W)}catch(e){}return}if(d.id=='t'){T=d.textContent.trim()||T;sv();return}
if(!d.dataset.f)return;const k=d.closest('.card'),x=S[k.dataset.s].a[k.dataset.i];
if(d.dataset.f=='n')x.n=d.textContent.trim()||x.n;else{const v=d.textContent.replace(/\D/g,'');x.p=v?+v:null;d.textContent=fm(x.p)}sv()});
$('f').onchange=e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),w=320,h=240,s=Math.max(w/im.width,h/im.height);c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(im,(w-im.width*s)/2,(h-im.height*s)/2,im.width*s,im.height*s);S[tg[0]].a[tg[1]].img=c.toDataURL('image/jpeg',.6);sv();R()};im.src=r.result};r.readAsDataURL(fl);e.target.value=''};
const CLAVE='#editar';
function adm(){const ok=location.hash==CLAVE;$('e').hidden=!ok;if(!ok&&ed){ed=0;R()}}
addEventListener('hashchange',adm);adm();
R();
</script>
</body>
</html>
