// Pegar aquí la URL /exec de la Web App de Apps Script para usar la sincronización desde Google.
const URL_APPS_SCRIPT_PRECIOS = 'https://script.google.com/macros/s/AKfycbwqwNgWKcClFw-SuhQH0iGvvo0ZaLEG5dhZ35SgC-9V0kv6NMH3LqUjJZcx8Bbd6F5QFQ/exec';


let S = BASE_PRODUCTOS.map(([e,t,a])=>({e,t,a:a.map(x=>({...x, img: x.img||null}))}));
const $ = id => document.getElementById(id);
const fm = p => (p == null || isNaN(p) || p === '') ? 'Consultar' : '$' + Number(p).toLocaleString('es-AR');


const carrito = new Map();
let modoPedido = false;
let detallesPedidoAbiertos = false;
const escaparHtml = texto => String(texto).replace(/[&<>"']/g, caracter => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[caracter]));
function urlPedido(telefono) {
  const detalle = Array.from(carrito.entries()).map(([clave, cantidad]) => {
    const [si, xi] = clave.split('-').map(Number);
    const producto = S[si] && S[si].a[xi];
    return producto ? '- ' + cantidad + ' × ' + producto.n : '';
  }).filter(Boolean).join('\n');
  return 'https://wa.me/' + telefono + '?text=' + encodeURIComponent('Hola, quiero hacer este pedido:\n\n' + detalle);
}
function renderPedido() {
  const total = Array.from(carrito.values()).reduce((suma, cantidad) => suma + cantidad, 0);
  const boton = $('orderToggle');
  boton.textContent = (modoPedido ? 'Terminar' : (total ? 'Seguir agregando' : 'Cargar pedido')) + (total ? ' · ' + total : '');
  boton.setAttribute('aria-pressed', String(modoPedido));
  document.body.classList.toggle('order-mode', modoPedido);
  document.body.classList.toggle('order-open', total > 0);
  if (!total) detallesPedidoAbiertos = false;
  const panel = $('orderPanel');
  panel.hidden = total === 0;
  panel.classList.toggle('is-expanded', detallesPedidoAbiertos);
  $('orderDetails').hidden = !detallesPedidoAbiertos;
  $('orderTitle').textContent = 'Tu pedido · ' + total + (total === 1 ? ' producto' : ' productos');
  const botonDetalle = $('toggleOrderDetails');
  botonDetalle.textContent = modoPedido ? 'Listo' : (detallesPedidoAbiertos ? 'Ocultar' : 'Revisar pedido');
  botonDetalle.setAttribute('aria-expanded', String(detallesPedidoAbiertos));
  $('orderItems').innerHTML = Array.from(carrito.entries()).map(([clave, cantidad]) => {
    const [si, xi] = clave.split('-').map(Number);
    const producto = S[si] && S[si].a[xi];
    if (!producto) return '';
    return '<li><span class="order-product">' + escaparHtml(producto.n) + '<small>' + escaparHtml(fm(producto.p)) + '</small></span><div class="order-quantity"><button type="button" data-action="minus" data-key="' + clave + '" aria-label="Quitar uno">−</button><b>' + cantidad + '</b><button type="button" data-action="plus" data-key="' + clave + '" aria-label="Agregar uno">+</button></div></li>';
  }).join('');
  $('sendSebastian').href = total ? urlPedido('5491153442331') : '#';
  $('sendDaniel').href = total ? urlPedido('5491161943773') : '#';
  document.querySelectorAll('.add-product').forEach(botonProducto => {
    const cantidad = carrito.get(botonProducto.dataset.key) || 0;
    botonProducto.innerHTML = cantidad ? '<span aria-hidden="true">+</span><span class="add-count">' + cantidad + '</span>' : '+';
    botonProducto.setAttribute('aria-label', cantidad ? 'Agregar otro; ' + cantidad + ' en el pedido' : 'Agregar al pedido');
    botonProducto.setAttribute('aria-pressed', String(cantidad > 0));
  });
}

function R() {
  const q = $('q').value.toLowerCase();$('catsSelect').innerHTML = '<option value="" disabled selected>Ir a una categoría...</option>' + 
    S.map((s, i) => `<option value="${i}">${s.e} ${s.t}</option>`).join('');


  $('l').innerHTML = S.map((s, si) => {
    const grupos = new Map();
    s.a.forEach((x, xi) => {
      if (!x.n.toLowerCase().includes(q)) return;
      const grupo = x.g || '';
      if (!grupos.has(grupo)) grupos.set(grupo, []);
      grupos.get(grupo).push(`<div class="card"><div class="ph">${x.img ? `<img${x.crop ? ` class="crop-${x.crop}"` : ''} src="${x.img}" alt="${x.n}" tabindex="0" role="button" aria-label="Ampliar foto de ${x.n}" title="Ampliar foto" loading="lazy" onerror="this.outerHTML='${s.e}'">` : s.e}</div><div class="n">${x.n}</div><div class="p">${fm(x.p)}</div><button class="add-product" type="button" data-key="${si}-${xi}" aria-label="Agregar al pedido" aria-pressed="false">+</button></div>`);
    });
    const it = [...grupos.entries()].map(([grupo, cards]) =>
      `${grupo ? `<h3 class="subcat">${grupo}</h3>` : ''}<div class="g">${cards.join('')}</div>`
    ).join('');
    return it ? `<h2 id="c${si}">${s.t}</h2>${it}` : '';
  }).join('');
  renderPedido();
}
function cargarPrecios() {
  if (!URL_APPS_SCRIPT_PRECIOS) {
    return fetch('precios.json?_cb=' + Date.now(), { cache: 'no-store' }).then(r => {
      if (!r.ok) throw new Error('No se pudo consultar la lista de precios');
      return r.json();
    });
  }


  return new Promise((resolve, reject) => {
    const callback = '__preciosCallback' + Date.now();
    const script = document.createElement('script');
    const limpiar = () => { delete window[callback]; script.remove(); };
    const timeout = setTimeout(() => { limpiar(); reject(new Error('Tiempo de espera agotado')); }, 15000);
    window[callback] = data => { clearTimeout(timeout); limpiar(); resolve(data); };
    script.onerror = () => { clearTimeout(timeout); limpiar(); reject(new Error('No se pudo conectar con Google Apps Script')); };
    script.src = URL_APPS_SCRIPT_PRECIOS + (URL_APPS_SCRIPT_PRECIOS.includes('?') ? '&' : '?') + 'callback=' + callback + '&_cb=' + Date.now();
    document.head.appendChild(script);
  });
}


const norm = str => str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim();
const ALIAS_PRECIOS = {
  "jamon natural grassetto": "jamon natural graseto",
  "jamon crudo sin cuero el rey": "jamon crudo el rey",
  "provoleta aa": "provoleta doble a",
  "mortadela c/pistacho bocatti": "mortadela c /pistacho bocatti",
  "aceit negras s/carozo x 5 kg": "aceit negras s/carozo x 5 k g"
};


function aplicarPrecios(preciosDocs) {
  S.forEach(cat => {
    cat.a.forEach(prod => {
      const pBuscado = norm(prod.n);
      const clave = preciosDocs[pBuscado] !== undefined ? pBuscado : ALIAS_PRECIOS[pBuscado];
      if (clave && preciosDocs[clave] !== undefined) {
        prod.p = preciosDocs[clave];
      }
    });
  });


  R();
}


const imageDialog = $('imageDialog');
const imageDialogPhoto = $('imageDialogPhoto');
const imageDialogCaption = $('imageDialogCaption');


function abrirFoto(img) {
  imageDialogPhoto.src = img.currentSrc || img.src;
  imageDialogPhoto.alt = img.alt;
  imageDialogCaption.textContent = img.alt;
  imageDialog.showModal();
}


$('orderToggle').addEventListener('click', () => {
  modoPedido = !modoPedido;
  renderPedido();
});
$('toggleOrderDetails').addEventListener('click', () => {
  if (modoPedido) {
    modoPedido = false;
    detallesPedidoAbiertos = true;
  } else {
    detallesPedidoAbiertos = !detallesPedidoAbiertos;
  }
  renderPedido();
});
$('continueOrder').addEventListener('click', () => {
  modoPedido = true;
  detallesPedidoAbiertos = false;
  renderPedido();
});
$('orderPanel').addEventListener('click', e => {
  const boton = e.target.closest('[data-action]');
  if (!boton) return;
  const clave = boton.dataset.key;
  const cantidad = carrito.get(clave) || 0;
  if (boton.dataset.action === 'plus') carrito.set(clave, cantidad + 1);
  if (boton.dataset.action === 'minus') {
    if (cantidad <= 1) carrito.delete(clave);
    else carrito.set(clave, cantidad - 1);
  }
  renderPedido();
});
$('l').addEventListener('click', e => {
  const agregar = e.target.closest('.add-product');
  if (agregar && modoPedido) {
    e.preventDefault();
    e.stopPropagation();
    const clave = agregar.dataset.key;
    carrito.set(clave, (carrito.get(clave) || 0) + 1);
    renderPedido();
    return;
  }
  const img = e.target.closest('.ph img');
  if (img) abrirFoto(img);
});


$('l').addEventListener('keydown', e => {
  const img = e.target.closest('.ph img');
  if (img && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    abrirFoto(img);
  }
});


$('imageDialogClose').onclick = () => imageDialog.close();
imageDialog.addEventListener('click', e => {
  if (e.target === imageDialog) imageDialog.close();
});


$('catsSelect').onchange = e => {
  const el = $('c' + e.target.value);
  if (el) el.scrollIntoView({ behavior: 'smooth' });
};


$('q').oninput = R;
renderPedido();
$('up').onclick = () => scrollTo({ top: 0, behavior: 'smooth' });


async function actualizarPrecios() {
  const status = $('syncStatus');
  try {
    const preciosDocs = await cargarPrecios();
    if (!preciosDocs || !Object.keys(preciosDocs).length) throw new Error('La lista de precios está vacía');
    aplicarPrecios(preciosDocs);
    status.textContent = 'Precios sincronizados · ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  } catch (error) {
    try {
      const respaldo = await fetch('precios.json?_cb=' + Date.now(), { cache: 'no-store' }).then(r => {
        if (!r.ok) throw new Error('No se pudo consultar el respaldo de precios');
        return r.json();
      });
      if (!respaldo || !Object.keys(respaldo).length) throw new Error('El respaldo de precios está vacío');
      aplicarPrecios(respaldo);
      status.textContent = 'Mostrando la última lista guardada; se reintentará la sincronización.';
    } catch (errorRespaldo) {
      R();
      status.textContent = 'No se pudieron actualizar los precios. Se volverá a intentar automáticamente.';
    }
  }
}


actualizarPrecios();
// Si la página queda abierta, consulta nuevamente el documento cada minuto.
setInterval(() => {
  if (document.visibilityState === 'visible') actualizarPrecios();
}, 60 * 1000);
</script>
